<style>
:root{--bg:#f3f5fa;--sf:#fff;--tx:#14203b;--mu:#667491;--bd:#e2e7f1;--ac:#2457c5;--acx:#fff;--g:#17a673;--y:#f2a516;--r:#e0484f;--n:#edf1f8;--sh:0 1px 2px rgba(20,32,70,.06),0 8px 20px rgba(20,32,70,.06);
--acs:color-mix(in srgb,var(--ac) 11%,var(--sf));--hd1:color-mix(in srgb,var(--ac) 82%,#000);--hd2:color-mix(in srgb,var(--ac) 52%,#000);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--sf:#151d2f;--tx:#e9eef8;--mu:#93a0bb;--bd:#243049;--ac:#7aa5f5;--acx:#0b1220;--g:#3dbb82;--y:#f0b43c;--r:#ee6b72;--n:#1c2740;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1220;--sf:#151d2f;--tx:#e9eef8;--mu:#93a0bb;--bd:#243049;--ac:#7aa5f5;--acx:#0b1220;--g:#3dbb82;--y:#f0b43c;--r:#ee6b72;--n:#1c2740;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd1);z-index:30}
header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;padding:18px 20px 24px;border-radius:0 0 26px 26px}
header small{opacity:.85;font-size:.78rem;letter-spacing:.04em}header h1{margin:0;font-size:1.35rem;font-weight:700;line-height:1.3}
.hright{display:flex;align-items:center;gap:8px}
.thm{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.16);color:#fff;font-size:1.15rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.thm:active{transform:scale(.94)}
.hbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.hl{display:flex;align-items:center;gap:10px;min-width:0}.ht2{min-width:0}.hlogo{width:38px;height:38px;flex:none;border-radius:11px;box-shadow:0 0 0 1px rgba(255,255,255,.3);background:#14306e;object-fit:cover}@media(max-width:359px){.hlogo{display:none}}
.uchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 12px;border-radius:999px;font-size:.75rem;backdrop-filter:blur(8px)}
.uchip button{background:rgba(255,255,255,.2);border:0;color:#fff;padding:3px 9px;font-size:.7rem;border-radius:999px}
main{max-width:760px;margin:0 auto;padding:16px 14px calc(140px + env(safe-area-inset-bottom, 0px))}

nav{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline:14px;display:flex;gap:4px;background:color-mix(in srgb,var(--sf) 94%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);padding:8px;border-radius:24px;box-shadow:0 12px 35px rgba(0,0,0,0.18);z-index:25}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--mu);padding:8px 2px;border-radius:16px}
nav button.on{color:var(--ac);background:var(--acs);font-weight:700}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;transition:transform .12s,background .15s}
button:active{transform:scale(.96)}
button.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.dng{color:var(--r)}
input,textarea,select{border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:11px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
label{font-size:.78rem;color:var(--mu);display:block;margin-bottom:4px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:700}
.sh{font-size:.9rem;margin:20px 4px 10px;color:var(--mu);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:.82rem}

.sec-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px}
@media(min-width:500px){.sec-tabs{grid-template-columns:repeat(4,1fr)}}
.sec-tabs button{width:100%;padding:10px 8px;font-size:.8rem;border-radius:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.f{display:flex;flex-direction:column;gap:10px}.f .pri{margin-top:4px;padding:12px}

.sesk.skm{grid-template-columns:1fr 1fr;gap:8px}

/* ===== v2 : تحسين صفحتي «التلاميذ» و«المواعيد» — ألوان متناسقة مشتقة من لون القسم ===== */
:root{--av0:#2457c5;--av1:#0c8a7b;--av2:#8e3fa8;--av3:#d1631a;--av4:#c2365b;--av5:#5a8f1c;--vi:#7c3aed;--sk:#0f7fb5;--or:#d1631a}

:root[data-theme="dark"]{--av0:#7aa5f5;--av1:#52cdbd;--av2:#d39be8;--av3:#f5a76a;--av4:#f08aa6;--av5:#a3d46b;--vi:#a78bfa;--sk:#6cc4ee;--or:#f5a76a}

.stx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}

.stx.apx>div:nth-child(2){--tc:var(--ac)}

.spl.ok{--pc:var(--g)}.spl.rp{--pc:var(--y)}.spl.nw{--pc:var(--sk)}.spl.dr{--pc:var(--r)}.spl.tr{--pc:var(--mu)}.spl.mg{--pc:var(--vi)}.spl.sp{--pc:var(--or)}

/* ===== صفحة المواعيد : هوية لونية مستقلة (كحلي + ذهبي) وخلايا بأحجام مدروسة ===== */
html[data-sec="ap"]{--ac:#1a3f73;--gold:#c58b1a;--bg:#f3f2ed;--bd:#e3dfd3;--n:#ecebe3;--hd1:#10264a;--hd2:#1e4b86;--sh:0 1px 2px rgba(16,38,74,.06),0 8px 20px rgba(16,38,74,.07)}

html[data-sec="ap"][data-theme="dark"]{--ac:#92b6ea;--gold:#e6b94f;--bg:#0b121f;--sf:#131c2e;--bd:#25314a;--n:#1a2640;--hd1:#12305a;--hd2:#1f4a85}

.stx.apx>div:nth-child(1){--tc:var(--g)}
.stx.apx>div:nth-child(2){--tc:var(--ac)}
.stx.apx>div:nth-child(3){--tc:var(--gold)}

/* نموذج موعد جديد */
.apn{border-top:4px solid var(--gold);padding:16px 14px}
.apn h3{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin-bottom:14px}
.apn h3 .hi{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:var(--acx);font-size:1.1rem;font-weight:700}
.apn .f{gap:14px}
.apn .sc2{gap:10px}
.apn .sc2>div{min-width:0}
.apn .sc2:has(>div:only-child){grid-template-columns:1fr}
.apn label{margin-bottom:5px;font-size:.78rem;font-weight:700;color:var(--mu)}
.apn input,.apn select{min-height:46px;padding:10px 12px;font-size:.92rem;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf)}
.apn input:focus,.apn select:focus{border-color:var(--ac);outline:2px solid color-mix(in srgb,var(--ac) 30%,transparent);outline-offset:0}
.apn .apo{padding:12px;border:1.5px dashed color-mix(in srgb,var(--gold) 55%,var(--bd));border-radius:14px;background:color-mix(in srgb,var(--gold) 7%,var(--sf))}
.apn .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.apn .chips button.chk{min-height:44px;padding:8px 6px;border-radius:12px;font-size:.82rem;background:var(--sf);border:1.5px solid var(--bd);color:var(--mu)}
.apn .chips button.chk.on{background:color-mix(in srgb,var(--gold) 16%,var(--sf));border-color:var(--gold);color:color-mix(in srgb,var(--gold) 55%,var(--tx))}
.apn .pri{min-height:50px;padding:12px;font-size:1rem;border-radius:14px;background:var(--ac);color:var(--acx);border-color:var(--ac)}
.apn>p.mu{margin:14px 0 0!important;padding:10px 12px;border-radius:12px;background:var(--n);font-size:.74rem;line-height:1.7}
.apxp{width:100%;min-height:46px;margin:0 0 6px;padding:10px;border-radius:14px;font-size:.88rem;background:color-mix(in srgb,var(--gold) 10%,var(--sf));border:1.5px solid color-mix(in srgb,var(--gold) 55%,var(--bd));color:color-mix(in srgb,var(--gold) 55%,var(--tx))}

/* عناوين الأقسام */
.apsh{display:flex;align-items:center;gap:10px;margin:20px 2px 10px;font-size:.95rem;color:var(--tx)}
.apsh .dt{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.apsh.old .dt{background:var(--mu);box-shadow:0 0 0 4px color-mix(in srgb,var(--mu) 20%,transparent)}
.apsh em{font-style:normal;margin-inline-start:auto;min-width:28px;text-align:center;padding:2px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:color-mix(in srgb,var(--ac) 12%,var(--sf));color:var(--ac)}
.apsh.old em{background:var(--n);color:var(--mu)}

/* بطاقة الموعد : شبكة ثابتة (تاريخ | محتوى | إنجاز) ثم شريط أزرار */
.ap{--uc:var(--ac);display:grid;grid-template-columns:64px minmax(0,1fr) 40px;grid-template-areas:"dt ai ck" "apa apa apa";column-gap:12px;row-gap:10px;align-items:start;padding:12px;margin-bottom:12px;border-radius:18px;background:color-mix(in srgb,var(--uc) 3%,var(--sf));border:1px solid color-mix(in srgb,var(--uc) 22%,var(--bd));border-inline-start:5px solid var(--uc)}
.ap.ov{--uc:var(--r)}.ap.td{--uc:var(--g)}.ap.sn{--uc:var(--gold)}.ap.lt{--uc:var(--ac)}.ap.dn{--uc:var(--mu);opacity:.78}
.ap .adt{grid-area:dt;width:64px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;border-radius:14px;text-align:center;background:color-mix(in srgb,var(--uc) 13%,var(--sf));border:1px solid color-mix(in srgb,var(--uc) 30%,transparent);color:color-mix(in srgb,var(--uc) 62%,var(--tx))}
.adt b{font-size:1.55rem;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.adt span{font-size:.72rem;font-weight:700;line-height:1.25}
.adt small{font-size:.62rem;opacity:.85;margin-top:2px;line-height:1.2}
.ap.dn .adt b{text-decoration:none}
.ap .ai{grid-area:ai;display:flex;flex-direction:column;gap:6px;min-width:0}
.att{font-size:1rem;font-weight:700;line-height:1.4;word-break:break-word}
.atm{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:.8rem;color:var(--mu)}
.ati{font-weight:700;color:var(--tx)}
.aps{padding:2px 10px;border-radius:999px;font-size:.7rem;font-weight:700;background:color-mix(in srgb,var(--uc) 16%,var(--sf));color:color-mix(in srgb,var(--uc) 62%,var(--tx));border:1px solid color-mix(in srgb,var(--uc) 35%,transparent)}
.ach-w{display:flex;flex-wrap:wrap;gap:5px}
.ach{--cc:var(--ac);padding:2px 10px;border-radius:999px;font-size:.7rem;font-weight:600;background:color-mix(in srgb,var(--cc) 11%,var(--sf));color:color-mix(in srgb,var(--cc) 65%,var(--tx));border:1px solid color-mix(in srgb,var(--cc) 28%,transparent)}
.ach.rm{--cc:var(--gold)}.ach.rp{--cc:var(--vi)}
.ap .ck{grid-area:ck;width:40px;height:40px;padding:0;border-radius:50%;border:2px solid var(--uc);background:transparent;color:var(--uc);font-size:1.05rem;font-weight:800}
.ap.dn .ck{background:var(--uc);color:#fff;border-color:var(--uc)}
.ap .apa{grid-area:apa;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--uc) 28%,var(--bd))}
.ap .apb{min-height:40px;padding:6px 2px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:12px;opacity:1;white-space:nowrap;background:var(--sf);border:1.5px solid var(--bd);color:var(--mu);box-shadow:none}
.ap .apb.on{background:color-mix(in srgb,var(--ac) 12%,var(--sf));border-color:var(--ac);color:var(--ac)}
.ap .apb.ed{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.ap .apb.dng{padding:6px 2px;font-size:.74rem;background:color-mix(in srgb,var(--r) 8%,var(--sf));border-color:color-mix(in srgb,var(--r) 40%,var(--bd));color:var(--r)}

/* ===== v4 : إبراز البطاقات عن الخلفية + تمييز القادمة عن المنتهية ===== */
html[data-sec="ap"]{--bg:#e5e3d9;--bd:#cdc8b8;--n:#dedbd0;--sh:0 1px 2px rgba(16,38,74,.10),0 6px 16px rgba(16,38,74,.10)}
@media(prefers-color-scheme:dark){html[data-sec="ap"]:not([data-theme="light"]){--bg:#060b15;--sf:#17243d;--bd:#34446a;--n:#0e1627;--sh:0 1px 2px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.4)}}
html[data-sec="ap"][data-theme="dark"]{--bg:#060b15;--sf:#17243d;--bd:#34446a;--n:#0e1627;--sh:0 1px 2px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.4)}

/* إحصاءات */
.stx.apx>div{background:var(--sf);border:1px solid var(--bd);border-top:4px solid var(--tc);box-shadow:var(--sh)}
.stx.apx b{color:var(--tx)}

/* النموذج */
.apn{background:var(--sf);box-shadow:var(--sh);border:1px solid var(--bd);border-top:5px solid var(--gold)}
.apn input,.apn select{background:color-mix(in srgb,var(--ac) 6%,var(--bg));border:1.5px solid color-mix(in srgb,var(--ac) 28%,var(--bd))}
.apn .chips button.chk{background:color-mix(in srgb,var(--ac) 6%,var(--bg));border-color:color-mix(in srgb,var(--ac) 28%,var(--bd))}
.apn .apo{background:color-mix(in srgb,var(--gold) 10%,var(--bg));border-color:color-mix(in srgb,var(--gold) 60%,var(--bd))}

/* عناوين القوائم */
.apsh{padding:9px 14px;margin:22px 0 12px;border-radius:14px;background:var(--ac);color:var(--acx);border-inline-start:6px solid var(--gold);box-shadow:var(--sh)}
.apsh .dt{background:var(--gold);box-shadow:none}
.apsh em{background:var(--acx);color:var(--ac)}
.apsh.old{background:transparent;color:var(--mu);border:1.5px dashed var(--bd);border-inline-start:6px solid var(--mu);box-shadow:none}
.apsh.old .dt{background:var(--mu)}
.apsh.old em{background:var(--n);color:var(--mu)}

/* المواعيد القادمة : بطاقات بارزة وكتلة تاريخ ملوّنة بالكامل */
.ap{--uo:#fff;background:var(--sf);border:1px solid color-mix(in srgb,var(--uc) 35%,var(--bd));border-inline-start:6px solid var(--uc);box-shadow:var(--sh)}
.ap.lt{--uo:var(--acx)}
.ap.sn{--uo:#2a1d00}
.ap .adt{background:var(--uc);border:0;color:var(--uo);box-shadow:0 3px 8px color-mix(in srgb,var(--uc) 35%,transparent)}
.ap .adt small{opacity:.92}
@media(prefers-color-scheme:dark){html[data-sec="ap"]:not([data-theme="light"]) .ap.td,html[data-sec="ap"]:not([data-theme="light"]) .ap.ov{--uo:#0b1220}}
html[data-sec="ap"][data-theme="dark"] .ap.td,html[data-sec="ap"][data-theme="dark"] .ap.ov{--uo:#0b1220}

/* المواعيد المنتهية : مسطّحة، بإطار منقّط، دون ظل ولا لون ساطع */
.ap.dn,.ap.ov{opacity:1;background:transparent;box-shadow:none;border:1.5px dashed var(--bd);border-inline-start:1.5px dashed var(--bd)}
.ap.dn .adt,.ap.ov .adt{background:transparent;box-shadow:none;border:1.5px dashed var(--bd);color:var(--mu)}
.ap.dn .att,.ap.ov .att{color:var(--mu);font-weight:600}
.ap.dn .att{text-decoration:line-through}
.ap.dn .aps{--uc:var(--mu)}
.ap.dn .ck,.ap.ov .ck{border-color:var(--mu);color:var(--mu)}
.ap.dn .ck{background:var(--mu);color:var(--sf)}
.ap.dn .apa,.ap.ov .apa{border-top-color:var(--bd)}

/* ===== v5 : خلفيات القوائم — لوحة زرقاء للقادمة ولوحة رمادية للمنتهية ===== */
html[data-sec="ap"]{--bg:#e3e8f1;--bd:#c5cddb;--n:#d8deea}
.apl{padding:12px 12px 2px;margin-bottom:14px;border-radius:22px}
.apl.up{background:color-mix(in srgb,var(--ac) 13%,var(--bg));border:1px solid color-mix(in srgb,var(--ac) 32%,var(--bg))}
.apl.old{background:color-mix(in srgb,var(--mu) 22%,var(--bg));border:1px solid color-mix(in srgb,var(--mu) 30%,var(--bg))}
.apl .empty{background:var(--sf);border-style:solid;border-color:var(--bd);margin-bottom:10px}
.apl.old .ap{background:color-mix(in srgb,var(--sf) 42%,transparent);border:1px solid color-mix(in srgb,var(--mu) 30%,transparent);border-inline-start:6px solid var(--mu)}
.apl.old .ap.ov{border-inline-start-color:color-mix(in srgb,var(--r) 55%,var(--mu))}
.apl.old .ap .adt{border:1px solid color-mix(in srgb,var(--mu) 40%,transparent);background:color-mix(in srgb,var(--mu) 12%,transparent)}
.apl.old .ap .apb{background:transparent}
.apsh.old{background:color-mix(in srgb,var(--mu) 22%,var(--bg));border:1px solid color-mix(in srgb,var(--mu) 30%,var(--bg));border-inline-start:6px solid var(--mu)}

/* ===== v6 : خلفيات بطاقات المواعيد حسب حالتها ===== */
.apl .ap{border:1px solid color-mix(in srgb,var(--uc) 38%,var(--bd));border-inline-start:6px solid var(--uc)}
.apl.up .ap.td{background:color-mix(in srgb,var(--g) 13%,var(--sf))}
.apl.up .ap.sn{background:color-mix(in srgb,var(--gold) 16%,var(--sf))}
.apl.up .ap.lt{background:color-mix(in srgb,var(--ac) 9%,var(--sf))}
.apl.old .ap.ov{background:color-mix(in srgb,var(--r) 11%,var(--sf));border:1px solid color-mix(in srgb,var(--r) 35%,var(--bd));border-inline-start:6px solid var(--r)}
.apl.old .ap.dn{background:color-mix(in srgb,var(--mu) 16%,var(--sf));border:1px solid color-mix(in srgb,var(--mu) 35%,var(--bd));border-inline-start:6px solid var(--mu)}
.apl.old .ap.ov .adt{background:color-mix(in srgb,var(--r) 14%,var(--sf));border:1px solid color-mix(in srgb,var(--r) 40%,transparent);color:color-mix(in srgb,var(--r) 70%,var(--tx))}
.apl.old .ap.dn .adt{background:color-mix(in srgb,var(--mu) 20%,var(--sf));border:1px solid color-mix(in srgb,var(--mu) 40%,transparent)}
.apl.old .ap.ov .att{color:var(--tx)}
.apl.old .ap.ov .ck{border-color:var(--r);color:var(--r)}
.apl .ap .apa{border-top:1px solid color-mix(in srgb,var(--uc) 30%,var(--bd))}
.apl .ap .apb{background:var(--sf)}
.apl.old .ap .apb{background:var(--sf)}
.apl.old .ap .apb.dng{background:color-mix(in srgb,var(--r) 8%,var(--sf))}


/* ===== v8 : بطاقات الإحصاءات العلوية بألوان صلبة متدرجة ===== */
.stx.apx>div{border:0;border-top:0;box-shadow:0 4px 10px rgba(16,38,74,.18);min-height:72px;position:relative;overflow:hidden}
.stx.apx>div::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.14)}
.stx.apx>div:nth-child(1){background:linear-gradient(135deg,#2fa36f,#1d7a50)}
.stx.apx>div:nth-child(2){background:linear-gradient(135deg,#2a5aa8,#16345c)}
.stx.apx>div:nth-child(3){background:linear-gradient(135deg,#76859b,#4b586b)}
.stx.apx b,.stx.apx>div b{color:#fff;font-size:1.5rem}
.stx.apx span{color:rgba(255,255,255,.92);font-weight:700}

/* ===== v9 : صفحة الجدول — خلفية مميزة للجدول + تحديد عمود اليوم الحالي ===== */
.tt-wrap{padding:8px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 10%,var(--sf)),color-mix(in srgb,var(--ac) 4%,var(--n)));border:1px solid color-mix(in srgb,var(--ac) 26%,var(--bd));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px color-mix(in srgb,var(--ac) 12%,transparent)}
.tt-grid{position:relative;z-index:0}
.tt-day{background:color-mix(in srgb,var(--ac) 14%,var(--sf));color:var(--ac)}
.tt-corner{background:color-mix(in srgb,var(--ac) 8%,var(--sf));color:var(--mu)}
.tt-grid th.tt-tcol{position:relative;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 80%,#000));color:var(--acx);border-radius:12px 12px 0 0;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 40%,transparent)}
.tt-grid td.tt-tcol{position:relative}
.tt-grid td.tt-tcol::before{content:"";position:absolute;inset:-3px 0 0 0;background:color-mix(in srgb,var(--ac) 13%,transparent);z-index:-1}
.tt-grid td.tt-tcol::after{content:"";position:absolute;inset:-3px 0 0 0;border-inline:2.5px solid var(--ac);pointer-events:none}
.tt-grid td.tt-tend::before{border-radius:0 0 12px 12px}
.tt-grid td.tt-tend::after{border-bottom:2.5px solid var(--ac);border-radius:0 0 12px 12px}

/* ===== v10 : خلفية الجدول داكنة ومستقلة عن ألوان الخلايا ؛ عمود اليوم بلون كهرماني ساطع ===== */
:root{--ttb1:#2a3858;--ttb2:#161e34;--tdy1:#f7c948;--tdy2:#e0a41a;--tdyx:#2a1d00}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ttb1:#0f1729;--ttb2:#060a13}}
:root[data-theme="dark"]{--ttb1:#0f1729;--ttb2:#060a13}
.tt-wrap{background:linear-gradient(160deg,var(--ttb1),var(--ttb2));border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 22px rgba(10,20,50,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.tt-grid .tt-day{background:rgba(255,255,255,.12);color:#fff}
.tt-grid .tt-corner{background:rgba(255,255,255,.07);color:rgba(255,255,255,.72)}
.tt-wrap .tt-cell-btn.empty{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.26);color:rgba(255,255,255,.55)}
.tt-grid th.tt-tcol{background:linear-gradient(180deg,var(--tdy1),var(--tdy2));color:var(--tdyx);box-shadow:0 3px 12px rgba(247,201,72,.4)}
.tt-grid td.tt-tcol::before{background:rgba(247,201,72,.15)}
.tt-grid td.tt-tcol::after{border-inline-color:var(--tdy1)}
.tt-grid td.tt-tend::after{border-bottom-color:var(--tdy1)}

/* ===== v11 : ضبط عرض الأعمدة (ظهور الخميس كاملًا) + تمييز خانات التوقيت ===== */
.tt-wrap{padding:6px 4px;overflow-x:auto;overflow-y:hidden;max-width:100%}
.tt-grid{min-width:100%;max-width:100%;border-spacing:3px}
.tt-grid .tt-corner{width:19%}
.tt-grid .tt-day{width:16.2%;overflow:visible;text-overflow:clip;white-space:nowrap;padding:8px 1px!important;font-size:clamp(.6rem,calc(.7rem * var(--tt-z, 1)),.9rem)}
.tt-grid td,.tt-grid th{min-width:0}
.tt-grid td:first-child{padding-inline-end:0}

/* خانات التوقيت : بطاقات صلبة نيلية، مميزة عن خلايا الحصص الفاتحة */
.tt-grid .tt-slot-btn{background:linear-gradient(160deg,#5b6dd6,#3a47a8);color:#fff;border:1px solid rgba(255,255,255,.3);border-inline-start:4px solid #f7c948;border-radius:12px;font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums;box-shadow:0 3px 8px rgba(20,30,80,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.tt-grid .tt-slot-btn span{direction:ltr;unicode-bidi:embed}

/* ===== v12 : تبديل التنسيقين — خلايا الأيام بتنسيق التوقيت السابق، وخلايا التوقيت بتنسيق الأيام السابق ===== */
.tt-grid .tt-day{background:linear-gradient(160deg,#5b6dd6,#3a47a8);color:#fff;border:1px solid rgba(255,255,255,.3);border-inline-start:4px solid #f7c948;border-radius:12px;font-weight:800;letter-spacing:.01em;box-shadow:0 3px 8px rgba(20,30,80,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.tt-grid th.tt-tcol{border-inline-start-color:transparent;border-color:transparent;border-radius:12px 12px 0 0}
.tt-grid .tt-slot-btn{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;font-weight:700;letter-spacing:0;box-shadow:none}

/* ===== v13 : خانات الأقسام بلون القسم نفسه (نسخة فاتحة وأخرى للوضع الداكن) ===== */
.tt-cell-btn.has-sec{--c-use:var(--c-ac,var(--ac))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tt-cell-btn.has-sec{--c-use:var(--c-acd,var(--c-ac,var(--ac)))}}
:root[data-theme="dark"] .tt-cell-btn.has-sec{--c-use:var(--c-acd,var(--c-ac,var(--ac)))}
.tt-wrap .tt-cell-btn.has-sec:not(.is-next):not(.is-now):not(.k-cnl){background:linear-gradient(160deg,color-mix(in srgb,var(--c-use) 28%,var(--sf)),color-mix(in srgb,var(--c-use) 13%,var(--sf)));border:1px solid color-mix(in srgb,var(--c-use) 60%,transparent);border-inline-start:5px solid var(--c-use);color:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tt-wrap .tt-cell-btn.has-sec:not(.k-cnl) small{color:color-mix(in srgb,var(--c-use) 65%,var(--tx))}

/* ===== v14 : أقصى عرض ممكن للجدول + خانات الاستراحة أخفّ حضورًا ===== */
html[data-v="sch"] main{max-width:1200px;padding-inline:4px}
html[data-v="sch"] main .card{padding:10px 4px;border-radius:14px}
html[data-v="sch"] main .card>*:not(.tt-wrap){margin-inline:8px}
html[data-v="sch"] .tt-wrap{padding:4px 2px;border-radius:14px}
html[data-v="sch"] .tt-grid{border-spacing:2px}
.tt-grid .tt-corner{width:15%}
.tt-grid .tt-day{width:17%}
.tt-wrap .tt-cell-btn.is-rest{min-height:calc(34px * var(--tt-z, 1));background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.22);color:rgba(255,255,255,.6)!important;font-weight:500;box-shadow:none}
.tt-wrap .tt-cell-btn.is-rest span{opacity:.85}

/* ===== v15 : تمييز الحصة الموالية — إطار منقّط أبيض + هالة نابضة بلون القسم، مع الإبقاء على لون الخلية الأساسي ===== */
.tt-wrap .tt-cell-btn.is-next.has-sec:not(.is-now):not(.k-cnl){background:linear-gradient(160deg,color-mix(in srgb,var(--c-use) 28%,var(--sf)),color-mix(in srgb,var(--c-use) 13%,var(--sf)));border:1px solid color-mix(in srgb,var(--c-use) 60%,transparent);border-inline-start:5px solid var(--c-use);color:var(--tx);outline:2.5px dashed #fff;outline-offset:2px;position:relative;z-index:1;box-shadow:0 0 0 5px color-mix(in srgb,var(--c-use) 35%,transparent),0 6px 16px rgba(0,0,0,.35);animation:ttnext 2.2s ease-in-out infinite}
@keyframes ttnext{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--c-use) 10%,transparent),0 6px 16px rgba(0,0,0,.35)}}
.tt-cell-btn.is-next .tt-badge{background:#fff;color:var(--c-use,var(--ac));border:1px solid var(--c-use,var(--ac));font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.25)}
@media(prefers-reduced-motion:reduce){.tt-wrap .tt-cell-btn.is-next{animation:none!important}}

/* ===== v17 : الأنشطة غير المرتبطة بقسم (استقبال، مرافقة …) — قريبة من الاستراحة لكن بتدرج أخضر مزرق وإطار أوضح ===== */
.tt-wrap .tt-cell-btn.has-sec.k-oth:not(.is-now):not(.k-cnl){background:rgba(94,200,190,.13);border:1px dashed rgba(110,215,205,.55);border-inline-start:3px solid rgba(110,215,205,.75);color:rgba(215,248,243,.92);font-weight:600}
.tt-wrap .tt-cell-btn.has-sec.k-oth:not(.is-next):not(.is-now):not(.k-cnl){box-shadow:none}
.tt-wrap .tt-cell-btn.has-sec.k-oth:not(.k-cnl) small{color:rgba(190,235,230,.75)}

/* ===== v18 : لكل نوع نشاط (استقبال، مرافقة …) لونه الخاص، والخلايا المتشابهة تشترك في اللون نفسه ===== */
.tt-wrap .tt-cell-btn.has-sec.k-oth:not(.is-now):not(.k-cnl){background:color-mix(in srgb,var(--oc,#5ec8be) 15%,transparent);border:1px dashed color-mix(in srgb,var(--oc,#5ec8be) 60%,transparent);border-inline-start:3px solid color-mix(in srgb,var(--oc,#5ec8be) 85%,transparent);color:color-mix(in srgb,var(--oc,#5ec8be) 35%,#fff)}
.tt-wrap .tt-cell-btn.has-sec.k-oth:not(.k-cnl) small{color:color-mix(in srgb,var(--oc,#5ec8be) 55%,#fff)}

/* ===== v19 : شريط الأقسام في أعلى الصفحات — أقل هامش ممكن على يمين ويسار اسم القسم ===== */
html .sec-tabs{gap:3px}
html .sec-tabs button{flex:1 0 auto;min-width:0;padding:8px 5px;font-size:.76rem;border-width:1.2px;border-radius:10px;line-height:1.3}

/* ===== v20 : كل خانة قسم في الشريط بلون القسم نفسه (فاتح + نسخة للوضع الداكن) ===== */
html .sec-tabs button{--su:var(--sc,var(--ac));background:color-mix(in srgb,var(--su) 13%,var(--sf));border:1.2px solid color-mix(in srgb,var(--su) 50%,transparent);color:color-mix(in srgb,var(--su) 78%,var(--tx))}
html .sec-tabs button.on{background:var(--su);border-color:var(--su);color:#fff;font-weight:700;box-shadow:0 3px 8px color-mix(in srgb,var(--su) 40%,transparent)}
@media(prefers-color-scheme:dark){html:not([data-theme="light"]) .sec-tabs button{--su:var(--scd,var(--sc,var(--ac)))}html:not([data-theme="light"]) .sec-tabs button.on{color:#0b1220}}
html[data-theme="dark"] .sec-tabs button{--su:var(--scd,var(--sc,var(--ac)))}
html[data-theme="dark"] .sec-tabs button.on{color:#0b1220}
/* ===== زر «تحديد الكل» بلون مميز ومتناسق مع خانات التقييم ===== */
.evm button.evall{background:linear-gradient(135deg,#0f766e,#14a38f);color:#fff;border:1.5px solid #0f766e;font-weight:700;box-shadow:0 2px 6px rgba(15,118,110,.28);margin-inline-start:4px}
.evm button.evall.off{background:linear-gradient(135deg,#64748b,#475569);border-color:#475569;box-shadow:0 2px 6px rgba(71,85,105,.28)}
.lkp .evm button.evall{border-color:#0f766e}.lkp .evm button.evall.off{border-color:#475569}
@media(prefers-color-scheme:dark){html:not([data-theme="light"]) .evm button.evall{background:linear-gradient(135deg,#14a38f,#2dd4bf);color:#06201c;border-color:#2dd4bf}html:not([data-theme="light"]) .evm button.evall.off{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#0b1220;border-color:#cbd5e1}}
html[data-theme="dark"] .evm button.evall{background:linear-gradient(135deg,#14a38f,#2dd4bf);color:#06201c;border-color:#2dd4bf}html[data-theme="dark"] .evm button.evall.off{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#0b1220;border-color:#cbd5e1}

/* ===== تصدير تقرير القسم: سطر واحد + الجدول فقط ===== */
.xhdr{display:none}
.rep .stt tr.avr td{background:#e6edfb;font-weight:800;border-top:2px solid var(--ac);color:#18233a}
.lscp .stt tr.avr td,.lscp .stt tr.avr:nth-child(even) td{background:#e6edfb}
body.xp #rep .bn,body.xp #rep .bd>*:not(.stwrap){display:none!important}
body.xp #rep .bd{padding:10px 0 0}
body.xp #rep .xhdr{display:flex!important;align-items:center;justify-content:space-between;gap:14px;flex-wrap:nowrap;white-space:nowrap;background:var(--ac);color:#fff;padding:9px 16px;font-size:.88rem;line-height:1.4;border-radius:8px;margin:0 0 2px}
body.xp #rep .xhdr b{font-size:.95rem}
body.xp #rep .xhdr span+span::before,body.xp #rep .xhdr b+span::before{content:"";display:inline-block;width:1px;height:.95em;background:rgba(255,255,255,.55);margin-inline:0 12px;vertical-align:-2px}
body.xp #rep{border-radius:0}
/* ===== تمرير أفقي للجدول والمخطط مع تثبيت عمود التلميذ ===== */
.hsbar{display:flex;align-items:center;gap:6px;margin:6px 0 4px;font-size:.68rem;color:var(--mu,#62708a)}
.hsbar button{width:34px;height:28px;padding:0;border-radius:8px;border:1px solid var(--bd,#d8e0ee);background:var(--n,#eef2f8);color:var(--ac);font-size:.8rem;cursor:pointer}
.hsbar button:active{background:var(--ac);color:#fff}
.hsc{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin}
@media screen{
.rep:not(.lscp) .hsc>.stt{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.rep:not(.lscp) .hsc>.stt td,.rep:not(.lscp) .hsc>.stt th{white-space:nowrap;padding-inline:8px}
.rep .stt .stk,.rep .stt .stc{position:sticky;z-index:2}
.rep .stt .stk{inset-inline-start:0;min-width:46px;width:46px;box-sizing:border-box;text-align:center}
.rep .stt .stc{inset-inline-start:0;box-shadow:-2px 0 0 rgba(0,0,0,.06)}
.rep .stt .stk+.stc{inset-inline-start:46px}
.rep .stt td.stc,.rep .stt td.stk{background:#fff}
.rep .stt th.stc,.rep .stt th.stk{background:var(--n)}
.rep .stt td.stc{font-weight:700;text-align:start}
.rep .ecw.hsc{margin-bottom:14px}
}
body.xp .hsbar{display:none!important}
@media print{.hsbar{display:none!important}.hsc{overflow:visible!important}.ecin{min-width:0!important}}
/* ===== تثبيت رأس الجدول وسطر معدل القسم + خط المعدل في المخطط ===== */
@media screen{
.rep:not(.lscp) .stwrap>.hsc{max-height:70vh;overflow:auto}
.rep:not(.lscp) .stt th{position:sticky;top:0;z-index:3;box-shadow:0 2px 0 var(--bd,#d8e0ee)}
.rep:not(.lscp) .stt th.stc,.rep:not(.lscp) .stt th.stk{z-index:5}
.rep:not(.lscp) .stt tr.avr td{position:sticky;bottom:0;z-index:2;box-shadow:0 -2px 0 var(--ac)}
.rep:not(.lscp) .stt tr.avr td.stc,.rep:not(.lscp) .stt tr.avr td.stk{z-index:4}
}
.egl.avg{border-top:2px solid #7c3aed;opacity:1;z-index:4}
.egl.avg b{position:absolute;inset-inline-end:2px;top:-17px;background:#7c3aed;color:#fff;font-size:.58rem;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap;line-height:1.5}

function slotMinutes(s){
  var m = String(s||"").match(/(\d{1,2})\s*:\s*(\d{2})/);
  return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : 9999;
}

function sortTimetable(tt){
  if(!tt || !Array.isArray(tt.slots)) return;
  var days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
  var indexed = tt.slots.map(function(sl, i){ return { slot: sl, oldIdx: i, mins: slotMinutes(sl) }; });
  indexed.sort(function(a, b){ return a.mins - b.mins || a.oldIdx - b.oldIdx; });
  var newSlots = [];
  var newCells = {};
  indexed.forEach(function(item, newIdx){
    newSlots.push(item.slot);
    days.forEach(function(d){
      var oldKey = d + "_" + item.oldIdx;
      if(tt.cells && tt.cells[oldKey]){
        newCells[d + "_" + newIdx] = tt.cells[oldKey];
      }
    });
  });
  tt.slots = newSlots;
  tt.cells = newCells;
}

function getDeviceFingerprint(){
  try {
    var savedFp = localStorage.getItem(LOCAL_DEVICE_FP_KEY);
    if(savedFp && savedFp.length >= 12) return savedFp;
  } catch(e){}
  var raw = [
    navigator.userAgent || "",
    navigator.language || "",
    screen.colorDepth || "",
    Intl.DateTimeFormat().resolvedOptions().timeZone || "",
    navigator.hardwareConcurrency || "",
    navigator.platform || ""
  ].join("|");
  var fp = "dev_" + Math.abs(raw.split("").reduce(function(a,b){return((a<<5)-a)+b.charCodeAt(0)|0},0)).toString(16) + "_" + Math.random().toString(36).substring(2,7);
  try { localStorage.setItem(LOCAL_DEVICE_FP_KEY, fp); } catch(e){}
  return fp;
}

}

function seedFromList(k){
  var CF = [
   ["الرابعة متوسط إناث",4,5,17],
   ["الأولى متوسط ذكور",4,5,17],
   ["الأولى متوسط إناث",3,5,15]
  ];
  var f = CF[k-1];
  var c = mkS(k, f[0]);
  c.rows = f[1]; c.cols = f[2];
  for(var i=0;i<f[3];i++){ var s = mk("تلميذ " + (i+1)); s.seat = i; c.students.push(s); }
  return c;
}
function seed4M(){
  var c = mkS(0, "الرابعة متوسط ذكور");
  c.rows = 3; c.cols = 5;
  var k = 0;
  for(var i=0;i<15;i++){ if(i===7||i===12) continue; k++; var s = mk("تلميذ " + k); s.seat = i; c.students.push(s); }
  return c;
}
function gen(k){
  if(k === 0) return seed4M();
  if(k >= 1) return seedFromList(k);
  var names = ["الأولى متوسط ذكور", "الأولى متوسط إناث"];
  var counts = [17, 15];
  var rowsArr = [4, 3];
  var colsArr = [5, 5];
  var c = mkS(k, names[k-2]);
  c.rows = rowsArr[k-2]; c.cols = colsArr[k-2];
  for(var i=1; i<=counts[k-2]; i++){
    var s = mk("تلميذ " + i);
    s.seat = i-1;
    c.students.push(s);
  }
  return c;
}

function normalizeData(){
  ALL.appts = ALL.appts || [];
  if(!ALL.timetable || !ALL.timetable.slots || ALL.ttv !== 2){ ALL.timetable = defaultTimetable(); ALL.ttv = 2; }
  ALL.secs.forEach(function(sec,i){ sec.schedule = sec.schedule || {}; sec.att = sec.att || {}; if(sec.ci===undefined) sec.ci = i % PAL.length; });
  if(ALL.active>=ALL.secs.length||ALL.active<0) ALL.active=0;
  if(!ALL.s4v){
    ALL.s4v = 1;
    var s0 = ALL.secs[0];
    var untouched = s0 && s0.students.every(function(s){
      return /^تلميذ \d+$/.test(s.name) && !Object.keys(s.rec||{}).length && !Object.keys(s.sc||{}).length && !(s.notes||[]).length && !s.beh;
    });
    if(untouched) ALL.secs[0] = seed4M();
  }
  if(!ALL.s4v2){
    ALL.s4v2 = 1;
    var old0 = ALL.secs[0], ns0 = seed4M();
    var have = {};
    (old0 ? old0.students : []).forEach(function(s){ have[s.name] = s; });
    var okAll = old0 && old0.rows === 3 && old0.cols === 5 && ns0.students.every(function(s){ return have[s.name] && have[s.name].seat === s.seat; });
    if(!okAll){
      ns0.students.forEach(function(s){
        var o = have[s.name];
        if(o){ s.id = o.id; s.beh = o.beh; s.notes = o.notes; s.part = o.part; s.hw = o.hw; s.ex = o.ex; s.nb = o.nb; s.sc = o.sc; s.rec = o.rec; s.mn = o.mn || {}; s.fz = o.fz || 1; }
      });
      if(old0 && old0.schedule) ns0.schedule = old0.schedule;
      ALL.secs[0] = ns0;
    }
  }
  if(!ALL.lv2){
    ALL.lv2 = 1;
    [1,2,3].forEach(function(k){
      var sc = ALL.secs[k];
      if(sc && sc.students.every(function(s){
        return /^تلميذ \d+$/.test(s.name) && !Object.keys(s.rec||{}).length && !Object.keys(s.sc||{}).length && !(s.notes||[]).length && !s.beh;
      })) ALL.secs[k] = seedFromList(k);
    });
  }
  ALL.secs.forEach(function(sec,i){ if(sec.ci===undefined) sec.ci = i % PAL.length; });
  if(!ALL.nbv){
    ALL.nbv = 1;
    ALL.secs.forEach(function(sec){ sec.students.forEach(function(st){
      var R = st.rec || {};
      Object.keys(R).forEach(function(d){
        var r = R[d]; if(!r) return;
        if(r.nb !== undefined){ if(r.nbO === undefined) r.nbO = r.nb; delete r.nb; }
        if(r.nbActive !== undefined){ if(r.nbOActive === undefined) r.nbOActive = r.nbActive; delete r.nbActive; }
        if(r.hand !== undefined){ if(r.nbF === undefined) r.nbF = r.hand; delete r.hand; }
        if(r.handActive !== undefined){ if(r.nbFActive === undefined) r.nbFActive = r.handActive; delete r.handActive; }
      });
    }); });
  }
  if(!ALL.hw20){
    ALL.hw20 = 1;
    ALL.secs.forEach(function(sec){ sec.students.forEach(function(st){
      var R = st.rec || {};
      Object.keys(R).forEach(function(d){ var r = R[d]; if(r && typeof r.hw === "number") r.hw = Math.min(20, r.hw * 4); });
    }); });
  }
  S = ALL.secs[ALL.active] || ALL.secs[0];
  save();
}

  }

var BK_MAX=6*1024*1024;

  var cnt=0,BAD=/^(__proto__|constructor|prototype)$/,dropped=0;

    if(++cnt>600000||d>14)fail("بنية مفرطة التعقيد");

    if(typeof v==="number"){if(!isFinite(v))fail("رقم غير صالح");return v}
    if(typeof v==="string"){if(v.length>20000)fail("نص طويل جدًا");return v}
    if(Array.isArray(v))return v.map(function(x){return clean(x,d+1)});
    if(typeof v==="object"){var o={};Object.keys(v).forEach(function(k){if(!BAD.test(k))o[k]=clean(v[k],d+1)});return o}

  }
  function int(v,lo,hi){if(typeof v==="string"&&/^\d{1,5}$/.test(v))v=parseInt(v,10);return(typeof v==="number"&&v%1===0&&v>=lo&&v<=hi)?v:null}
  function num(v,def){if(typeof v==="string"&&/^-?\d+(\.\d+)?$/.test(v))v=parseFloat(v);return(typeof v==="number"&&isFinite(v))?v:def}

  function obj(x){return !!x&&typeof x==="object"&&!Array.isArray(x)}
  try{
    var d=clean(data,0);
    if(!obj(d)||!Array.isArray(d.secs)||d.secs.length<1||d.secs.length>60)fail("الأقسام");
    d.secs.forEach(function(c){
      if(!obj(c))fail("قسم غير صالح");
      if(c.id!==undefined)c.id=ident(c.id,"معرّف قسم");
      ["rows","cols"].forEach(function(k){if(c[k]!==undefined){var r=int(c[k],1,60);if(r===null)fail("أبعاد المقاعد");c[k]=r}});
      if(c.ci!==undefined){var ci=int(c.ci,0,999);if(ci===null)fail("لون القسم");c.ci=ci}
      if(!Array.isArray(c.students))c.students=[];

      c.students.forEach(function(s){
        if(!obj(s))fail("بيانات تلميذ");
        s.id=(s.id===undefined||s.id===null)?newId():ident(s.id,"معرّف تلميذ");
        s.name=(typeof s.name==="string")?s.name:String(s.name==null?"":s.name);
        s.seat=(s.seat===null||s.seat===undefined)?null:int(s.seat,0,9999);

      });
    });
    if(d.active!==undefined){var a=int(d.active,0,999);d.active=a===null?0:a}
    if(d.appts!==undefined){
      if(!Array.isArray(d.appts))d.appts=[];
      d.appts=d.appts.filter(function(a){
        try{
          if(!obj(a))throw 0;
          a.id=ident(a.id,"x");
          if(!/^\d{4}-\d{2}-\d{2}$/.test(String(a.d))||!/^\d{1,2}:\d{2}$/.test(String(a.h)))throw 0;
          a.d=String(a.d);a.h=String(a.h);
          a.sec=num(a.sec,0);a.rem=num(a.rem,0);
          if(a.t!==undefined&&typeof a.t!=="string")a.t=String(a.t);
          a.done=!!a.done;a.ack=!!a.ack;
          return true;
        }catch(e){dropped++;return false}
      });
    }
    if(d.timetable!==undefined){
      var tt=d.timetable;
      if(!obj(tt)){delete d.timetable}
      else{
        if(Array.isArray(tt.slots))tt.slots=tt.slots.slice(0,30).map(function(x){return String(x)});
        if(obj(tt.cells)){
          Object.keys(tt.cells).forEach(function(k){
            var c=tt.cells[k];
            if(!/^[^<>"'`&\\\u0000-\u001f]{1,40}$/.test(k)||!obj(c)){delete tt.cells[k];return}

  }
}

/* ===== استيراد / تصدير نقاط الامتحانات عبر Excel ===== */
var IMP=null,IMPU=null;
var AD="٠١٢٣٤٥٦٧٨٩";
function nrm(x){return String(x==null?"":x).replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[٠-٩]/g,function(d){return AD.indexOf(d)}).replace(/\s+/g," ").trim().toLowerCase()}
function nameKey(x){return nrm(x).replace(/[^a-z0-9\u0621-\u064A ]/g," ").replace(/\s+/g," ").trim()}
function nameToks(x){return nameKey(x).split(" ").filter(Boolean).sort().join(" ")}
function colKey(h){
  var s=nrm(h);if(!s)return null;
  var m=/^([cft])\s*([123])$/.exec(s);if(m)return m[1]+m[2];
  if(s.indexOf("تشخيص")>=0)return "diag";
  if((s.indexOf("معدل")>=0&&s.indexOf("نشاط")<0)||s.indexOf("مجموع")>=0||s.indexOf("سنوي")>=0||s.indexOf("ملاحظ")>=0)return null;
  var ty=null;
  if(s.indexOf("مستمر")>=0)ty="c";
  else if(s.indexOf("فرض")>=0)ty="f";
  else if(s.indexOf("اختبار")>=0||s.indexOf("امتحان")>=0)ty="t";
  else if(s.indexOf("تقويم")>=0||s.indexOf("تقييم")>=0)ty="c";
  if(!ty)return null;
  var n=0;
  if(s.indexOf("ثالث")>=0)n=3;else if(s.indexOf("ثان")>=0)n=2;else if(s.indexOf("اول")>=0)n=1;
  else{var d=/(?:^|\D)([123])(?:\D|$)/.exec(s);if(d)n=+d[1]}
  return n?ty+n:null;
}
function isNameHdr(h){var s=nrm(h);return !!s&&(s.indexOf("اسم")>=0||s.indexOf("لقب")>=0||s.indexOf("تلميذ")>=0||s.indexOf("طالب")>=0)}
function matNorm(v){if(v==null)return "";var t=typeof v==="number"?(isFinite(v)&&Math.floor(v)===v?v.toFixed(0):""):String(v);t=t.replace(/[٠-٩]/g,function(d){return AD.indexOf(d)}).replace(/[\s\u200e\u200f\u202a-\u202e\u00a0'’"`]/g,"");return /^[0-9A-Za-z\-\/]{4,}$/.test(t)?t:""}
function isMatHdr(h){var t=nrm(h);return !!t&&(/تعريف|معرف|تسجيل|وطني|matricule|identifiant|n°|numero/.test(t)||t==="id")}
function matColGuess(rows,from,skip){
  var best=-1,bestN=0,w=0,i,c;
  for(i=from;i<Math.min(from+60,rows.length);i++)w=Math.max(w,(rows[i]||[]).length);
  for(c=0;c<w;c++){
    if(skip&&skip.indexOf(c)>=0)continue;
    var n=0,t=0;
    for(i=from;i<Math.min(from+40,rows.length);i++){var v=(rows[i]||[])[c];if(v==null||String(v).trim()==="")continue;t++;if(/^\d{12,20}$/.test(matNorm(v)))n++}
    if(t>=3&&n/t>=.7&&n>bestN){best=c;bestN=n}
  }
  return best;
}
function stByMat(m){if(!m)return null;return S.students.find(function(x){return x.mat===m})||null}
function semFromText(t){t=nrm(t);if(t.indexOf("الفصل")<0)return 0;if(t.indexOf("الثالث")>=0)return 3;if(t.indexOf("الثاني")>=0)return 2;if(t.indexOf("الاول")>=0)return 1;return 0}
function colKey2(h,n){
  if(!n)return null;var t=nrm(h);if(!t)return null;
  if(/سنوي|ملاحظ|تقدير|مجموع/.test(t))return null;
  if(t.indexOf("معدل")>=0&&!/نشاط|تقويم|مستمر/.test(t))return null;
  if(t.indexOf("فرض")>=0)return "f"+n;
  if(/اختبار|امتحان/.test(t))return "t"+n;
  if(/نشاط|تقويم|مستمر/.test(t))return "c"+n;
  return null;
}
function parseScore(v){
  if(v===null||v===undefined)return {e:true};
  if(typeof v==="number")return isNaN(v)?{e:true}:{v:v};
  var s=String(v).replace(/[٠-٩]/g,function(d){return AD.indexOf(d)}).replace(/[,،]/g,".").trim();
  if(!s)return {e:true};
  if(/^-?\d+(\.\d+)?$/.test(s))return {v:parseFloat(s)};
  return {bad:s};
}
function findStudent(cands,mat){
  if(mat){var sm0=S.students.filter(function(x){return x.mat===mat});if(sm0.length===1)return sm0[0]}
  var byKey={},byTok={},amb={};
  S.students.forEach(function(s){var k=nameKey(s.name),tk=nameToks(s.name);if(byKey[k])amb[k]=1;byKey[k]=s;byTok[tk]=s});
  for(var i=0;i<cands.length;i++){var k=nameKey(cands[i]);if(k&&byKey[k]&&!amb[k])return byKey[k]}
  for(var j=0;j<cands.length;j++){var tk=nameToks(cands[j]);if(tk&&byTok[tk])return byTok[tk]}
  for(var q=0;q<cands.length;q++){
    var A=nameKey(cands[q]).split(" ").filter(Boolean);if(A.length<2)continue;
    var hits=S.students.filter(function(s){var B=nameKey(s.name).split(" ").filter(Boolean);var sm=A.length<=B.length?A:B,lg=A.length<=B.length?B:A;return sm.length>=2&&sm.every(function(w){return lg.indexOf(w)>=0})});
    if(hits.length===1)return hits[0];
  }
  for(var z=0;z<cands.length;z++){var lf=looseFind(S.students,cands[z]);if(lf)return lf}
  return null;
}
function parseSheetData(wb){
  var X=window.XLSX,all=[];
  for(var si=0;si<wb.SheetNames.length;si++){
    var rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,defval:null,raw:true});
    var semN=0;
    for(var r=0;r<Math.min(rows.length,25);r++){
      var row=rows[r]||[];
      for(var c0=0;c0<row.length;c0++){if(typeof row[c0]==="string"){var sn0=semFromText(row[c0]);if(sn0)semN=sn0}}
      var nameCols=[],keys=[],seen={},matCol=-1;
      for(var c=0;c<row.length;c++){
        if(row[c]==null)continue;
        var k=colKey(row[c])||colKey2(row[c],semN);
        if(k&&!seen[k]){seen[k]=1;keys.push({col:c,key:k,label:String(row[c]).trim()})}
        else if(!k&&isNameHdr(row[c]))nameCols.push(c);
        else if(!k&&matCol<0&&isMatHdr(row[c]))matCol=c;
      }
      if(matCol<0&&r>0){var pr=rows[r-1]||[];for(var pc=0;pc<pr.length;pc++){if(pr[pc]!=null&&isMatHdr(pr[pc])){matCol=pc;break}}}
      if(nameCols.length&&keys.length){
        if(matCol<0)matCol=matColGuess(rows,r+1,nameCols.concat(keys.map(function(kk){return kk.col})));
        var res={sheet:wb.SheetNames[si],keys:keys,total:0,matched:0,byMat:0,changes:[],unmatched:[],bad:[],matFill:[],hasMat:matCol>=0};
        var fillSeen={};
        for(var i=r+1;i<rows.length;i++){
          var rw=rows[i]||[];
          var mat=matCol>=0?matNorm(rw[matCol]):"";
          var parts=nameCols.map(function(c){return rw[c]==null?"":String(rw[c]).trim()}).filter(Boolean);
          if(!parts.length&&!mat)continue;
          var cands=parts.length>1?[parts.join(" "),parts.slice().reverse().join(" ")]:(parts.length?[parts[0]]:[]);
          var disp=cands[0]||mat;
          var hasVal=keys.some(function(kk){return rw[kk.col]!=null&&String(rw[kk.col]).trim()!==""});
          if(!hasVal&&!mat)continue;
          var st=findStudent(cands,mat),vals={};
          if(!st&&!parts.length)continue;
          res.total++;
          keys.forEach(function(kk){
            var p=parseScore(rw[kk.col]);
            if(p.e)return;
            if(p.bad!==undefined){res.bad.push(disp+" — "+kk.label+": «"+p.bad+"»");return}
            if(p.v<0||p.v>20){res.bad.push(disp+" — "+kk.label+": "+p.v+" (خارج 0–20)");return}
            vals[kk.key]=Math.round(p.v*100)/100;
          });
          if(st){
            res.matched++;
            if(mat&&st.mat===mat)res.byMat++;
            if(mat&&!st.mat&&!stByMat(mat)&&!fillSeen[mat]){fillSeen[mat]=1;res.matFill.push({s:st,mat:mat})}
            Object.keys(vals).forEach(function(k2){var ov=parseFloat(st.sc[k2]);res.changes.push({s:st,name:st.name,key:k2,nv:vals[k2],ov:isNaN(ov)?undefined:ov})});
          }else res.unmatched.push({name:disp,vals:vals,mat:mat});
        }
        all.push(res);
        break;
      }
    }
  }
  if(!all.length)return null;
  all.sort(function(a,b){return (b.matched-a.matched)||(b.total-a.total)});
  return all[0];
}

function nmLev(a,b){var m=a.length,n=b.length,i,j,p=[],c;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){c=[i];for(j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));p=c}return p[n]}
function nmVars(x){var t=nameKey(x).split(" ").filter(Boolean).map(function(w){return w.replace(/^ال(?=.{2})/,"")});return [t.join(""),t.slice().sort().join("")]}
function nmSim(cands,name){var B=nmVars(name),best=0;cands.forEach(function(cn){nmVars(cn).forEach(function(a){B.forEach(function(b){if(!a||!b)return;var s=1-nmLev(a,b)/Math.max(a.length,b.length);if(s>best)best=s})})});return best}
function mxPlan(sh){
  var out={ok:[],same:[],conf:[],none:[],nomat:0,free:[]},taken={},pend=[];
  sh.recs.forEach(function(rc){
    if(isHdrRec(rc))return;
    var p=recParts(rc);if(!p.length)return;
    var two=sh.ncol===2&&p.length>=2,nm=two?p[0]+" "+p[1]:p[0],cands=two?[nm,p[1]+" "+p[0]]:[nm],mat=rc.mat||"";
    if(!mat){out.nomat++;return}
    var st=findStudent(cands,mat);
    if(!st){pend.push({name:nm,mat:mat,cands:cands});return}
    if(taken[st.id]){out.conf.push({st:st,name:nm,mat:mat,why:"مكرر"});return}
    taken[st.id]=1;
    if(st.mat===mat)out.same.push({st:st,name:nm,mat:mat});
    else if(st.mat)out.conf.push({st:st,name:nm,mat:mat,why:"له رقم مختلف"});
    else out.ok.push({st:st,name:nm,mat:mat});
  });
  /* مطابقة تقريبية للأسماء المكتوبة بشكل مختلف (مسافات، همزات، ترتيب، حرف ناقص) */
  var free=S.students.filter(function(s){return !taken[s.id]}),pairs=[];
  pend.forEach(function(pd,i){
    var sc=free.map(function(s){return {i:i,s:s,v:nmSim(pd.cands,s.name)}}).sort(function(a,b){return b.v-a.v});
    if(sc.length&&sc[0].v>=.78&&(sc.length<2||sc[0].v-sc[1].v>=.05))pairs.push(sc[0]);
  });
  pairs.sort(function(a,b){return b.v-a.v});
  var usedS={},usedP={};
  pairs.forEach(function(q){
    if(usedS[q.s.id]||usedP[q.i])return;usedS[q.s.id]=1;usedP[q.i]=1;taken[q.s.id]=1;
    var pd=pend[q.i];
    if(q.s.mat===pd.mat)out.same.push({st:q.s,name:pd.name,mat:pd.mat});
    else if(q.s.mat)out.conf.push({st:q.s,name:pd.name,mat:pd.mat,why:"له رقم مختلف"});
    else out.ok.push({st:q.s,name:pd.name,mat:pd.mat,ap:1});
  });
  pend.forEach(function(pd,i){if(!usedP[i])out.none.push({name:pd.name,mat:pd.mat})});
  out.free=S.students.filter(function(s){return !taken[s.id]});
  return out;
}
function mxNm(t){return String(t==null?"":t).replace(/\s+/g," ").trim()}

var NI=null;

function cleanName(s){
  s=String(s==null?"":s).replace(/[\u200e\u200f\u202a-\u202e\u00a0]/g," ").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)});
  s=s.replace(/\b\d{1,4}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{1,4}\b/g," ").replace(/\b0\d{8,9}\b/g," ");
  s=s.replace(/^\s*\d{1,3}(?:\s*[.\-)\/:،]+\s*|\s+)/,"");
  s=s.replace(/(^|\s)\d+(?=\s|$)/g," ").replace(/[،,:;()\[\]{}|_*#"«»<>!؟?=+~^]+/g," ");
  s=s.replace(/^[\s.\-–—'’]+|[\s.\-–—'’]+$/g,"").replace(/\s+/g," ").trim();
  return s;
}
function hasLetters(s){return /[\u0600-\u06FFa-zA-Z]/.test(s)}
function recParts(r){return r.map(cleanName).filter(function(x){return x&&hasLetters(x)})}
function autoNcol(recs){
  var n=0,m=0;recs.forEach(function(r){var p=recParts(r);if(p.length){n++;if(p.length>=2)m++}});
  return n&&m/n>=.7?2:1;
}
function isHdrRec(r){
  var k=nrm(r.join(" "));if(!k)return true;
  if(k.indexOf("القائمه الاسميه")>=0)return true;

}
function looseFind(list,nm){
  var A=nameKey(nm).split(" ").filter(Boolean),ac=A.join("");
  if(!ac||(A.length<2&&ac.length<5))return null;
  var hits=list.filter(function(st){
    var B=nameKey(st.name).split(" ").filter(Boolean),bc=B.join("");
    var sm=A.length<=B.length?A:B,lg=A.length<=B.length?B:A;
    var sub=sm.length>=2&&sm.every(function(w){return lg.indexOf(w)>=0});
    var pre=Math.min(ac.length,bc.length)>=8&&(bc.indexOf(ac)===0||ac.indexOf(bc)===0);
    return sub||pre;
  });
  return hits.length===1?hits[0]:null;
}
function exKeys(){var k={},tk={},m={};S.students.forEach(function(s){k[nameKey(s.name)]=s;tk[nameToks(s.name)]=s;if(s.mat)m[s.mat]=s});return {k:k,t:tk,m:m,list:S.students}}
function npRows(recs,o){

    if(es)st="exists";else if(seen[key]||seen[tk]||(mt&&seen["#"+mt]))st="dup";
    else if(nm.split(" ").length>7||nm.length<3||(/[a-zA-Z]/.test(nm)&&/[\u0600-\u06FF]/.test(nm)))st="warn";
    seen[key]=1;seen[tk]=1;if(mt)seen["#"+mt]=1;

function nmRoleOf(h){
  var s=nrm(h);if(!s)return null;
  if(s.length>28||/قائمه|اسميه|جدول|وزاره|مديريه|ثانويه|متوسطه|ابتدائيه/.test(s))return null;
  var w=s.split(/\s+/),bad=["تاريخ","مكان","عنوان","هاتف","رقم","ولي","الاب","الام","اب","ام","جنس","الجنس","ملاحظات","قسم","فوج","السنه","المستوي","الميلاد","الولاده","تسجيل","الاقامه"];
  for(var i=0;i<w.length;i++)if(bad.indexOf(w[i])>=0)return null;
  if(s.indexOf("لقب")>=0&&s.indexOf("اسم")>=0)return "both";
  if(s.indexOf("لقب")>=0)return "sn";
  if(s.indexOf("اسم")>=0||s.indexOf("تلميذ")>=0||s.indexOf("طالب")>=0)return "fn";

function npFromSheet(rows){

    var row=rows[r]||[],cols=[];
    for(var c=0;c<row.length;c++){var ro=row[c]==null?null:nmRoleOf(row[c]);if(ro)cols.push({c:c,ro:ro})}
    if(!cols.length)continue;
    var sn=cols.filter(function(x){return x.ro==="sn"})[0],fn=cols.filter(function(x){return x.ro==="fn"||x.ro==="both"})[0];
    var pick=(sn&&fn&&fn.ro==="fn")?[sn.c,fn.c]:[(fn||sn).c];
    var matC=-1;
    for(var rr=r;rr>=Math.max(0,r-3)&&matC<0;rr--){var hr=rows[rr]||[];for(var hc=0;hc<hr.length;hc++){if(hr[hc]!=null&&isMatHdr(hr[hc])&&pick.indexOf(hc)<0){matC=hc;break}}}
    if(matC>=0){var okN=0;for(var q=r+1;q<Math.min(r+41,rows.length);q++){if(matNorm((rows[q]||[])[matC]))okN++}if(!okN)matC=-1}
    if(matC<0)matC=matColGuess(rows,r+1,pick);
    var recs=[];
    for(var i=r+1;i<rows.length;i++){var rw=rows[i]||[];var cells=pick.map(function(c){return rw[c]==null?"":String(rw[c]).trim()});if(matC>=0)cells.mat=matNorm(rw[matC]);if(cells.some(Boolean))recs.push(cells)}
    return {recs:recs,ncol:pick.length,hdr:true,hasMat:matC>=0};
  }
  var mc=matColGuess(rows,0,[]);
  var rs=[];rows.forEach(function(rw){var cells=(rw||[]).map(function(x){return x==null?"":String(x).trim()});if(cells.some(Boolean)){if(mc>=0)cells.mat=matNorm((rw||[])[mc]);rs.push(cells)}});
  return {recs:rs,ncol:autoNcol(rs),hdr:false,hasMat:mc>=0};
}

function ttFindNext(tt){
  var days=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];
  var now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  var res={now:null,next:null};
  function teach(d,i,dt){var c=tt.cells&&tt.cells[d+"_"+i];if(c&&c.kind==="group"&&gGroupFor(c,dt)===null)return null;return c&&c.sec>=0&&c.type!=="استقبال"?c:null;}
  function rng(sl){var m=String(sl).match(/(\d{1,2})\s*:\s*(\d{2})\s*-\s*(\d{1,2})\s*:\s*(\d{2})/);return m?[+m[1]*60+ +m[2],+m[3]*60+ +m[4]]:null;}
  for(var off=0;off<8;off++){
    var dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+off);
    var di=dt.getDay(); if(di>4) continue;
    var d=days[di];
    for(var i=0;i<tt.slots.length;i++){
      var r=rng(tt.slots[i]),c=teach(d,i,dt); if(!r||!c) continue;
      if(off===0){
        if(nowMin>=r[0]&&nowMin<r[1]){res.now={d:d,i:i,c:c};continue;}
        if(r[0]<=nowMin) continue;
      }
      res.next={d:d,i:i,c:c,off:off};return res;
    }
  }
  return res;
}

function loadLib(src,test){
  var list=Array.isArray(src)?src:[src];
  return new Promise(function(res){
    if(test()) return res(true);
    var k=0;
    (function next(){
      if(k>=list.length) return res(false);
      var sc=document.createElement("script"),done=false;
      function fin(v){ if(done) return; done=true; if(v&&test()) res(true); else next(); }
      sc.src=list[k++]; sc.onload=function(){fin(true)}; sc.onerror=function(){fin(false)};
      document.head.appendChild(sc); setTimeout(function(){fin(false)},12000);
    })();
  });
}
